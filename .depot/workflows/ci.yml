name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/ai-review.test.mjs
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: tabbymctabface-extension
          path: TabbyMcTabface-v1.0.0.zip
          if-no-files-found: error

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/ai-review.test.mjs
      - name: Grok review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ai-review.mjs
