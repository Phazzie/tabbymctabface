version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Detroit
    open-pull-requests-limit: 10
    groups:
      test-tooling:
        patterns:
          - '@playwright/*'
          - '@vitest/*'
          - 'axe-core'
          - 'jsdom'
          - 'vite'
          - 'vitest'
      lint-tooling:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - 'globals'
          - 'typescript-eslint'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Detroit
    open-pull-requests-limit: 10
